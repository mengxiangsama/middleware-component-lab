services:
  store-init:
    image: alpine:3.22
    user: root
    command: chown -R 3000:3000 /home/rocketmq/store
    volumes:
      - rocketmq-store:/home/rocketmq/store
    restart: "no"

  namesrv:
    image: apache/rocketmq:5.5.0
    command: sh mqnamesrv
    ports:
      - "9876:9876"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9876'"]
      interval: 5s
      timeout: 3s
      retries: 20

  broker:
    image: apache/rocketmq:5.5.0
    command: sh mqbroker -c /home/rocketmq/conf/broker.conf
    depends_on:
      namesrv:
        condition: service_healthy
      store-init:
        condition: service_completed_successfully
    ports:
      - "10909:10909"
      - "10911:10911"
      - "10912:10912"
    volumes:
      - ./infra/rocketmq/broker.conf:/home/rocketmq/conf/broker.conf:ro
      - rocketmq-store:/home/rocketmq/store
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/10911'"]
      interval: 5s
      timeout: 3s
      retries: 30

  topic-init:
    image: apache/rocketmq:5.5.0
    depends_on:
      broker:
        condition: service_healthy
    command:
      - sh
      - -c
      - >-
        until sh mqadmin updateTopic -n namesrv:9876 -b broker:10911
        -t order-transaction-topic -a +message.type=TRANSACTION;
        do sleep 2; done
    restart: "no"

volumes:
  rocketmq-store:
